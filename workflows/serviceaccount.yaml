# Minimum identity for the training Workflow. Apply before train-workflow.yaml.
# Argo executors report step results through workflowtaskresults; without this
# Role the steps run but the controller marks them failed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-training
  namespace: intent-mlops
  # On EKS, bind an IRSA / Pod Identity role here to reach the S3 dataset and
  # MLflow artifact bucket instead of mounting static AWS keys.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: intent-training
  namespace: intent-mlops
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intent-training
  namespace: intent-mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: intent-training
subjects:
  - kind: ServiceAccount
    name: intent-training
    namespace: intent-mlops
