name: intent-mlops-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m intent_mlops.validate
      - run: python -m intent_mlops.train
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: intent-model-${{ github.sha }}
          path: artifacts/
          retention-days: 7
      - run: docker build -t intent-api:${{ github.sha }} .

