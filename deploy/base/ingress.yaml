apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intent-api
spec:
  ingressClassName: traefik
  rules:
    - host: intent-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intent-api
                port: {number: 80}

